name: Ping Supabase to Prevent Pausing

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
            url_secret: SUPABASE_URL
            key_secret: SUPABASE_ANON_KEY
          - name: staging
            url_secret: STAGING_SUPABASE_URL
            key_secret: STAGING_SUPABASE_ANON_KEY
    name: ping (${{ matrix.name }})

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Supabase client
        run: npm install @supabase/supabase-js

      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets[matrix.url_secret] }}
          SUPABASE_ANON_KEY: ${{ secrets[matrix.key_secret] }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');

          if (!process.env.SUPABASE_URL || !process.env.SUPABASE_ANON_KEY) {
            console.error('Missing Supabase secrets');
            process.exit(1);
          }

          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_ANON_KEY
          );

          supabase
            .from('CourseSubmissions')
            .select('id')
            .limit(1)
            .then(({ error }) => {
              if (error) {
                console.error('Ping failed:', error);
                process.exit(1);
              }
              console.log('Supabase keepalive successful');
              process.exit(0);
            });
          "
